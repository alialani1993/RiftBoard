<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rift Coaching Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&family=Fira+Mono:wght@400;500&family=Russo+One&family=Rubik:wght@400;500;600&family=Bebas+Neue&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: square map stage with a tool rail above it, inspector panel to the right; stacks to one column on phones */
:root{
  --bg:#e9eeed; --surface:#fbfcfc; --surface-2:#dfe6e4; --ink:#13201c; --muted:#56655f; --line:#ccd6d3;
  --accent:#a8720c; --accent-ink:#ffffff; --danger:#b4333a;
  --blue:#2d78ef; --red:#dc454c;
  --map-jungle:#0f1c18; --map-wall:#0f1c18; --map-edge:#3a4a3f; --map-ground:#243a31; --map-lane:#3d5247; --map-river:#1f4a5e; --map-pit:#2d3c35; --map-brush:#2f6a35; --map-base:#283b35; --map-ink:#e7eee9; --map-dim:#8fa39b;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#16201d; --surface-2:#1f2b28; --ink:#e5ece9; --muted:#93a39d; --line:#2a3835;
  --accent:#e6b14a; --accent-ink:#1a1305; --danger:#f0727a; --blue:#5b98ff; --red:#ff6b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#16201d; --surface-2:#1f2b28; --ink:#e5ece9; --muted:#93a39d; --line:#2a3835;
  --accent:#e6b14a; --accent-ink:#1a1305; --danger:#f0727a; --blue:#5b98ff; --red:#ff6b70; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{max-width:1220px;margin:0 auto 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}
.top .scn{color:var(--muted);font-size:13px}
.lookctl{margin-left:auto;display:flex;gap:6px;align-items:center}
.modebtn{width:34px;height:31px;padding:0;display:grid;place-items:center}
.modebtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modebtn .i-moon{fill:var(--ink);stroke:none}
.modebtn[data-now="dark"] .i-moon,.modebtn[data-now="light"] .i-sun{display:none}
.modeseg{align-self:flex-start}
.sheet-back[hidden]{display:none}
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(5,10,9,.45);display:flex;justify-content:flex-end;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(400px,100%);max-height:100%;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>*{flex-shrink:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-family:var(--f-display);font-size:18px;margin:0}
.sheet h3{font-family:var(--f-display);font-size:12px;margin:4px 0 0;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.fontlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontcard{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.fontcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fontcard b{font-size:17px;line-height:1.15;font-weight:700}
.fontcard span{font-size:12px;color:var(--muted)}
.fontcard i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;font-size:12px}
.presets button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.presets em{display:flex}.presets em i{width:12px;height:12px;border-radius:50%;margin-right:-3px;border:1.5px solid var(--surface)}
.colorrows{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 44px 92px;gap:8px;align-items:center;font-size:13px}
.crow input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--bg);cursor:pointer}
.crow .hex{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;text-transform:uppercase}
.msg.warn{color:var(--danger)}

.layout{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.stage > *{width:min(100%, calc(100dvh - 190px));min-width:min(100%,420px)}

.strip{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.strip .clock{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em}
.strip .b{color:var(--blue);font-weight:500}.strip .r{color:var(--red);font-weight:500}
.strip .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;margin-right:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.group button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
.group button:last-child{border-right:0}
.group button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.group button.t-blue[aria-pressed="true"]{background:var(--blue);color:var(--blue-ink,#fff)}
.group button.t-red[aria-pressed="true"]{background:var(--red);color:var(--red-ink,#fff)}
.swatch{width:30px;padding:6px 0!important;display:grid;place-items:center}
.swatch span{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.35)}
.swatch[aria-pressed="true"]{background:var(--surface-2)!important}
.swatch[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}

.mapwrap{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--map-jungle)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;background:rgba(10,18,16,.82);border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden;backdrop-filter:blur(4px)}
.zoomctl button{border:0;background:transparent;color:#e7eee9;min-width:34px;height:32px;font-size:17px;font-weight:600;cursor:pointer;padding:0 8px}
.zoomctl button#zFit{font-size:12.5px;letter-spacing:.04em;border-left:1px solid rgba(255,255,255,.14)}
.zoomctl button:hover{background:rgba(255,255,255,.1)}
.zoomctl span{color:#b8c6c0;font-family:var(--f-mono);font-size:11.5px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.viewbar .focus select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--ink)}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.viewbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.hint{color:var(--muted);font-size:12.5px}

/* map classes */
.m-jungle{fill:var(--map-jungle)} .m-wall{fill:var(--map-wall)}
.m-lane{fill:none;stroke:var(--map-lane);stroke-width:46;stroke-linecap:round;stroke-linejoin:round}
.m-river{fill:none;stroke:var(--map-river);stroke-width:62;stroke-linecap:round}
.m-base{fill:var(--map-base)}
.m-camp{fill:var(--map-dim);opacity:.7}
.m-label{fill:var(--map-dim);font-family:var(--f-mono);font-size:13px;text-anchor:middle;pointer-events:none}
.m-text{font-family:var(--f-display);font-weight:700;text-anchor:middle;pointer-events:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;position:sticky;top:12px}
@media (max-width:880px){.panel{position:static}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;border:0;background:transparent;padding:10px 5px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.pbody h2{font-family:var(--f-display);font-size:16px;margin:0;font-weight:700}
.pbody h3{font-family:var(--f-display);font-size:12px;margin:4px 0 0;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:80px;line-height:1.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:end}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.teamtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:#fff}
.teamtag.blue{background:var(--blue);color:var(--blue-ink,#fff)}.teamtag.red{background:var(--red);color:var(--red-ink,#fff)}
.helplist{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.helplist b{color:var(--ink);font-weight:600}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.roster button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0}
.roster button i{width:8px;height:8px;border-radius:50%;flex:none}
.roster button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{display:flex;flex-direction:column;gap:6px}
.saved .item{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.saved .item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.msg{font-size:12.5px;color:var(--muted);min-height:1em}
.wavegrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;align-items:center}
.wavegrid .teamtag{text-align:center}
.wavegrid .wl{font-size:13px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--ink)}
.stepper button:hover{background:var(--surface-2)}
.stepper b{min-width:24px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stepper.blue b{color:var(--blue)}.stepper.red b{color:var(--red)}
.fc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fc li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:6px 10px;font-size:12.5px;border-top:1px solid var(--line);align-items:center}
.fc li:first-child{border-top:0}
.fc b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.fc i{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.fc li.crash{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.fc li.bounce{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wstat{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}.wstat b{color:var(--ink);font-weight:600}.wstat b.bad{color:var(--danger)}
.comp{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.comp.blue{box-shadow:inset 3px 0 0 var(--blue)}.comp.red{box-shadow:inset 3px 0 0 var(--red)}
.comphead{display:flex;gap:8px;align-items:center}
.comphead .quick{flex:1;min-width:0;font-size:12px}
.comprow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center}
.comprow .role{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.comp input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.comp input.warn{border-color:var(--danger)}
.inv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{min-height:46px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);padding:4px 6px;text-align:center;line-height:1.2}
.slot.full{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;position:relative;font-weight:500}
.slot.full b{position:absolute;top:1px;right:5px;font-weight:600;color:var(--muted);font-size:13px}
.slot.full:hover b{color:var(--danger)}
.slot span{overflow-wrap:anywhere}
.picker{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.picker input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.itlist{max-height:220px;overflow-y:auto;display:flex;flex-direction:column}
.itlist button{display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12.5px}
.itlist button:hover:not(:disabled){background:var(--surface-2)}
.itlist button:disabled{opacity:.45;cursor:not-allowed}
.itlist i{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
#io{font-family:var(--f-mono);font-size:11.5px;min-height:90px}
.importbox{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--accent);border-radius:8px;padding:10px;background:var(--bg)}
.importbox[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:min(440px,calc(100vw - 32px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<header class="top">
  <h1>Rift Coaching Board</h1>
  <span class="scn" id="scnName"></span>
  <div class="lookctl"><button class="btn" id="lookBtn" aria-haspopup="dialog">Appearance</button>
  <button class="btn modebtn" id="modeBtn" aria-label="Switch to dark mode"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></button></div>
</header>

<div class="sheet-back" id="lookBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="lookTitle">
    <div class="sheet-head"><h2 id="lookTitle">Appearance</h2><button class="btn" id="lookClose">Done</button></div>
    <h3>Fonts</h3>
    <div class="fontlist" id="fontList"></div>
    <h3>Mode</h3>
    <div class="group modeseg" id="modeSeg" role="group" aria-label="Mode"><button data-mode="system">Match device</button><button data-mode="light">Light</button><button data-mode="dark">Dark</button></div>
    <h3>Color scheme</h3>
    <div class="presets" id="presets"></div>
    <h3>Fine-tune</h3>
    <div class="colorrows">
      <label class="crow"><span>Buttons &amp; highlights</span><input type="color" id="col-accent"><input class="hex" id="hex-accent" maxlength="7" spellcheck="false"></label>
      <label class="crow"><span>Text</span><input type="color" id="col-ink"><input class="hex" id="hex-ink" maxlength="7" spellcheck="false"></label>
      <label class="crow"><span>Panels</span><input type="color" id="col-surface"><input class="hex" id="hex-surface" maxlength="7" spellcheck="false"></label>
      <label class="crow"><span>Page background</span><input type="color" id="col-bg"><input class="hex" id="hex-bg" maxlength="7" spellcheck="false"></label>
    </div>
    <p class="hint" style="margin:0">Blue and red always stay the game's side colors.</p>
    <p class="msg" id="lookMsg"></p>
    <div class="btns"><button class="btn" id="lookReset">Restore defaults</button></div>
    <p class="hint" style="margin:0">Saved in this browser. Shared boards keep the viewer's own look.</p>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="layout">
  <section class="stage">
    <div class="strip" id="strip"></div>
    <div class="toolbar">
      <div class="group" id="tools" role="group" aria-label="Tool">
        <button data-tool="move">Move</button>
        <button data-tool="ward">Ward</button>
        <button data-tool="control">Control</button>
        <button data-tool="pen">Pen</button>
        <button data-tool="arrow">Arrow</button>
        <button data-tool="wave">Wave</button>
        <button data-tool="erase">Erase</button>
      </div>
      <div class="group" id="teams" role="group" aria-label="Ward team">
        <button class="t-blue" data-team="blue">Blue</button>
        <button class="t-red" data-team="red">Red</button>
      </div>
      <div class="group" id="colors" role="group" aria-label="Drawing color"></div>
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="clearDraw">Clear drawings</button>
      <button class="btn" id="resetGame">Reset game</button>
    </div>

function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}
const svg=document.getElementById('map'), gStatic=document.getElementById('static'), gDyn=document.getElementById('dyn'), mask=document.getElementById('fogmask');
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function buildStatic(){
  gStatic.innerHTML='';
  const C={wall:cssVar('--map-wall'),edge:cssVar('--map-edge'),ground:cssVar('--map-ground'),river:cssVar('--map-river'),lane:cssVar('--map-lane'),pit:cssVar('--map-pit'),brush:cssVar('--map-brush')};
  const smooth=pts=>{let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)}, ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)}, ${p2[0]} ${p2[1]}`;}return d;};
  const S=(d,w,col,op)=>el('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':op??1},gStatic);
  el('rect',{x:0,y:0,width:1000,height:1000,fill:C.ground},gStatic);
  /* River: the channel between the real walls, from mid out to where it opens into top and bot lane */
  el('path',{d:TERRAIN.river,fill:C.river,'fill-rule':'evenodd'},gStatic);
  Object.values(LANE_WAYPOINTS).forEach(l=>S(smooth(l.map(([x,z])=>M(x,z))),46,C.lane,.85));
  Object.values(PITS).forEach(p=>el('circle',{cx:p.x,cy:p.y,r:38,fill:C.pit},gStatic));
  el('path',{d:TERRAIN.brush,fill:C.brush,'fill-rule':'evenodd',stroke:'#0c1a10','stroke-opacity':.45,'stroke-width':1},gStatic);
  el('path',{d:TERRAIN.wall,fill:C.wall,'fill-rule':'evenodd',stroke:C.edge,'stroke-width':2.2,'stroke-linejoin':'round'},gStatic);
  [['TOP',150,30],['MID',548,560],['BOT',850,985]].forEach(([t,x,y])=>el('text',{x,y,class:'m-label','font-size':14,'letter-spacing':3},gStatic,t));
}

/* ---------- line of sight ----------
   Sight grid from the same navigation grid: 255 = wall that blocks sight, 1-254 = brush patch id, 0 = open.

          const nx2=-(b[1]-a[1])/L*flip,ny2=(b[0]-a[0])/L*flip;return [q[0]+nx2*side*gap,q[1]+ny2*side*gap];});};
      const marks=[];
      f.forEach((st,i)=>{
        const side=st.winner==='blue'?1:st.winner==='red'?-1:0,grey='#7f8c87',col=i===0&&st.winner?teamCol(st.winner):grey;   // only the next checkpoint lights up

        const big=st.event==='crash'||st.event==='bounce',g=el('g',{transform:sc(e[0],e[1]),opacity:op},gDyn);
        if(big)el('circle',{cx:e[0],cy:e[1],r:6.5,fill:col,stroke:'#0b1512','stroke-width':1.8},g);
        if(isSel&&(big||i===f.length-1)){
          const q=laneAt(w.lane,st.w.t),ox=-q.dy*(side||1)*20,oy=q.dx*(side||1)*20;
          const lbl=st.event==='crash'?`CRASH ${fmtT(st.at)}`:st.event==='bounce'?`BOUNCE ${fmtT(st.at)}`:fmtT(st.at);
          el('text',{x:e[0]+ox,y:e[1]+oy+4,class:'m-text','font-size':big?11:9.5,fill:big?'#fff':cssVar('--map-ink'),'paint-order':'stroke',stroke:'#0b1512','stroke-width':3.5},g,lbl);}
      });
    }
    const g=el('g',{transform:sc(p.x,p.y)},gDyn);
    if(isSel)el('circle',{cx:p.x,cy:p.y,r:30,fill:'none',stroke:cssVar('--accent'),'stroke-width':3},g);
    // minions: blue stack behind the meeting point toward the blue base, red toward the red base
    [['blue',-1],['red',1]].forEach(([team,sd])=>{
      const comp=w[team],list=[...Array(comp.m).fill('m'),...Array(comp.c).fill('c'),...Array(comp.k).fill('k')],col=teamCol(team);
      list.forEach((kind,i)=>{const row=Math.floor(i/3),colI=i%3,off=6+row*7.2,lat=(colI-1)*7.2;

    });

      el('path',{d:`M${x2+p.dx*dir*7} ${y2+p.dy*dir*7} L${x2+nx*5} ${y2+ny*5} L${x2-nx*5} ${y2-ny*5} Z`,fill:col},g);}

/* ---------- render ---------- */

    state.champs.forEach(c=>{if(!c.dead&&!hidden(c.team,c.x,c.y))el('circle',{cx:c.x,cy:c.y,r:R.champ,fill:'none',stroke:teamCol(c.team),'stroke-opacity':.35},gDyn);});

  });

    const col=teamCol(c.team), isSel=sel&&sel.id===c.id;
    const g=el('g',{opacity:hidden(c.team,c.x,c.y)?.2:1,transform:sc(c.x,c.y)},gDyn);
    if(isSel) el('circle',{cx:c.x,cy:c.y,r:31,fill:'none',stroke:cssVar('--accent'),'stroke-width':4},g);
    el('circle',{cx:c.x,cy:c.y,r:24,fill:c.dead?'#3b4441':'#0d1714',stroke:c.dead?'#6d7a75':col,'stroke-width':5},g);
    const tag=(c.name||c.role).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||c.role;
    el('text',{x:c.x,y:c.y+5.5,class:'m-text','font-size':15,fill:c.dead?'#9aa6a1':'#fff'},g,tag);
    if(c.dead) el('path',{d:`M${c.x-13} ${c.y-13} L${c.x+13} ${c.y+13} M${c.x+13} ${c.y-13} L${c.x-13} ${c.y+13}`,stroke:'#e2675f','stroke-width':3,'stroke-linecap':'round'},g);
    el('circle',{cx:c.x+19,cy:c.y+18,r:10,fill:col,stroke:'#0d1714','stroke-width':2},g);
    el('text',{x:c.x+19,y:c.y+22,class:'m-text','font-size':11,fill:cssVar('--'+c.team+'-ink')||'#fff'},g,c.level);
    let bx=c.x-24;
    if(c.flash){badge(g,bx,c.y-30,'F','#f0a43a');bx+=17;}
    if(c.ult){badge(g,bx,c.y-30,'R','#c07cf0');}
    el('text',{x:c.x,y:c.y+44,class:'m-text','font-size':12,fill:cssVar('--map-ink'),'paint-order':'stroke',stroke:'#0b1512','stroke-width':3},g,c.dead&&c.respawn?`${c.name||c.role} · ${c.respawn}`:(c.name||c.role));
    if(showGold&&c.gold>0)el('text',{x:c.x,y:c.y+58,class:'m-text','font-size':11,fill:'#f2c94c','paint-order':'stroke',stroke:'#0b1512','stroke-width':3},g,c.gold.toLocaleString()+'g');
  });
  renderStrip();
}
function badge(g,x,y,t,col){el('rect',{x,y,width:15,height:14,rx:3,fill:col,stroke:'#0b1512','stroke-width':1.5},g);el('text',{x:x+7.5,y:y+11,class:'m-text','font-size':10.5,fill:'#111'},g,t);}
function drawStroke(d,parent){
  const p=d.pts; if(!p.length) return;

  el('path',{d:dd,fill:'none',stroke:'#071210','stroke-width':9*K,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.5},parent);
  el('path',{d:dd,fill:'none',stroke:d.color,'stroke-width':5*K,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':d.type==='arrow'?`${14*K} ${8*K}`:''},parent);

    const h=`M${x2} ${y2} L${x2-L*Math.cos(a-.45)} ${y2-L*Math.sin(a-.45)} L${x2-L*Math.cos(a+.45)} ${y2-L*Math.sin(a+.45)} Z`;
    el('path',{d:h,fill:d.color,stroke:'#071210','stroke-width':2*K,'stroke-opacity':.6},parent);

/* ---------- top strip ---------- */
function renderStrip(){
  const s=state, diff=s.gold.blue-s.gold.red, lead=diff===0?'Even':`<span class="${diff>0?'b':'r'}">${diff>0?'Blue':'Red'} +${(Math.abs(diff)/1000).toFixed(1)}k</span>`;
  const alive=t=>TOWERS.filter(x=>x.team===t&&x.kind==='tower'&&!s.towersDown.includes(x.id)).length;
  document.getElementById('strip').innerHTML=
   `<span class="clock">${esc(s.time)}</span>`+
   `<span><span class="lbl">Kills</span><span class="b">${s.kills.blue}</span> – <span class="r">${s.kills.red}</span></span>`+
   `<span><span class="lbl">Gold</span>${lead}</span>`+
   `<span><span class="lbl">Towers up</span><span class="b">${alive('blue')}</span> – <span class="r">${alive('red')}</span></span>`+
   `<span><span class="lbl">Drakes</span><span class="b">${cnt(s.dragons.blue)}</span> – <span class="r">${cnt(s.dragons.red)}</span></span>`;
  document.getElementById('scnName').textContent=s.name||'';
}
const cnt=t=>(t||'').split(',').map(x=>x.trim()).filter(Boolean).length;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- pointer ---------- */
let drag=null, live=null, pre=null;
function pt(e){const m=svg.getScreenCTM().inverse();const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return [Math.max(0,Math.min(1000,p.x)),Math.max(0,Math.min(1000,p.y))];}
const d2=(a,b,x,y)=>(a-x)**2+(b-y)**2;
function nearest(list,x,y,r){let best=null,bd=r*r;list.forEach(o=>{const d=d2(o.x,o.y,x,y);if(d<=bd){bd=d;best=o;}});return best;}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}

const ptrs=new Map();let pinch=null,pan=null;
const svgPt=(cx,cy)=>{const m=svg.getScreenCTM().inverse();const p=new DOMPoint(cx,cy).matrixTransform(m);return [p.x,p.y];};
function startPinch(){
  // a second finger turns any gesture into pinch-zoom / two-finger pan
  if(live){live=null;} if(drag){drag=null;} pan=null;
  const [a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:zoomLvl(),anchor:svgPt(mx,my),vb0:{...vb}};
}
svg.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); svg.setPointerCapture(e.pointerId);
  if(ptrs.size===2){startPinch();render();return;}
  if(ptrs.size>2) return;
  const [x,y]=pt(e); pre=snap();
  if(tool==='move'){
    const c=nearest(state.champs,x,y,32*K), w=c?null:nearest(state.wards,x,y,20*K), wv=(c||w)?null:nearest(state.waves.map(wavePos),x,y,26*K);
    if(wv){drag={wave:wv.w};sel={kind:'wave',id:wv.w.id};setTab('selected');}
    else if(c||w){const o=c||w;drag={o,dx:o.x-x,dy:o.y-y};sel={kind:c?'champ':'ward',id:o.id};setTab('selected');}
    else{const t=nearest(TOWERS,x,y,20*K);
      if(t){const i=state.towersDown.indexOf(t.id);if(i>=0)state.towersDown.splice(i,1);else state.towersDown.push(t.id);}
      else {sel=null;if(tab==='selected')renderPanel(); if(zoomLvl()>1.01)pan={cx:e.clientX,cy:e.clientY,vb0:{...vb}};}
    }
  }else if(tool==='ward'||tool==='control'){
    const w={id:uid(),team:placeTeam,type:tool,x,y};state.wards.push(w);sel={kind:'ward',id:w.id};drag={o:w,dx:0,dy:0};setTab('selected');
  }else if(tool==='wave'){
    const pr=projectLane(x,y);
    if(pr&&pr.dist<=55){const nw={id:uid(),lane:pr.lane,t:pr.t,blue:{m:3,c:3,k:0},red:{m:3,c:3,k:0},plan:'natural'};state.waves.push(nw);sel={kind:'wave',id:nw.id};drag={wave:nw};setTab('selected');}
    else toast('Tap on or near a lane to add a wave.');
  }else if(tool==='pen'||tool==='arrow'){
    live={id:uid(),type:tool,color:penColor,pts:[[x,y]]};
  }else if(tool==='erase'){
    const wv=nearest(state.waves.map(wavePos),x,y,22*K);
    const w=wv?null:nearest(state.wards,x,y,22*K);
    if(wv){state.waves=state.waves.filter(q=>q!==wv.w);if(sel&&sel.id===wv.w.id)sel=null;}
    else if(w){state.wards=state.wards.filter(q=>q!==w);if(sel&&sel.id===w.id)sel=null;}
    else{let best=null,bd=20*K;state.drawings.forEach(d=>{for(let i=0;i<d.pts.length;i++){const a=d.pts[i],b=d.pts[i+1]||a;const s=segDist([x,y],a,b);if(s<bd){bd=s;best=d;}}});
      if(best) state.drawings=state.drawings.filter(q=>q!==best);}
  }
  render(); if(tab==='selected') renderPanel();
});
svg.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),z=Math.max(1,Math.min(6,pinch.z0*d/pinch.d0)),w=1000/z;
    const r=svg.getBoundingClientRect(),mx=((a.x+b.x)/2-r.left)/r.width,my=((a.y+b.y)/2-r.top)/r.height;
    setView(pinch.anchor[0]-mx*w,pinch.anchor[1]-my*w,w);return;
  }
  if(pan){const r=svg.getBoundingClientRect(),k=vb.w/r.width;setView(pan.vb0.x-(e.clientX-pan.cx)*k,pan.vb0.y-(e.clientY-pan.cy)*k,pan.vb0.w);return;}
  if(!drag&&!live) return;
  const [x,y]=pt(e);
  if(drag&&drag.wave){const pr=projectLane(x,y);if(pr){drag.wave.lane=pr.lane;drag.wave.t=Math.round(pr.t*1000)/1000;}render();}
  else if(drag){drag.o.x=Math.round(x+drag.dx);drag.o.y=Math.round(y+drag.dy);render();}
  else if(live){
    if(live.type==='arrow'){live.pts[1]=[x,y];}
    else{const l=live.pts[live.pts.length-1];if(d2(l[0],l[1],x,y)>(6*K)**2)live.pts.push([x,y]);}
    render();
  }
});
function endPtr(e){
  if(e&&e.pointerId!=null)ptrs.delete(e.pointerId);

  pbody.innerHTML=`<h2>Import/Export</h2>
  <div class="btns"><button class="btn primary" id="s-save">Save current board</button><button class="btn" id="s-sample">Load example</button><button class="btn" id="s-blank">Blank board</button></div>
  <div class="saved">${saved.length?saved.map((s,i)=>`<div class="item"><span>${esc(s.name||'Untitled')} <span class="hint">· ${esc(s.time||'')}</span></span><button class="btn" data-load="${i}">Load</button><button class="btn danger" data-del="${i}" aria-label="Delete">✕</button></div>`).join(''):'<p class="hint" style="margin:0">Saved boards appear here. They are kept in this browser only.</p>'}</div>
  <h3>Share a board</h3>
  <p class="hint" style="margin:0">Export copies this board as text. Send it to a player in Discord, a DM or anywhere else. They tap Import and paste it.</p>
  <div class="btns"><button class="btn primary" id="s-export">Export board</button><button class="btn" id="s-import" aria-expanded="false" aria-controls="importBox">Import board</button></div>
  <div class="importbox" id="importBox" hidden>
    <label class="field"><span>Paste board text</span><textarea id="io" spellcheck="false" placeholder="Paste here. The board loads by itself."></textarea></label>
    <div class="btns"><button class="btn" id="s-cancel">Cancel</button></div>
  </div>
  <p class="msg" id="s-msg">${esc(msg||'')}</p>`;
  const io=document.getElementById('io'),box=document.getElementById('importBox'),imp=document.getElementById('s-import');
  const m=(t,bad)=>{const e=document.getElementById('s-msg');e.textContent=t;e.classList.toggle('warn',!!bad);};
  const load=s=>{const p=snap();state=normalize(s);sel=null;commit(p);render();};
  document.getElementById('s-save').onclick=()=>{const list=getSaved();const i=list.findIndex(s=>s.name===state.name);const copy=JSON.parse(snap());if(i>=0)list[i]=copy;else list.push(copy);store.set('rcb.saved',JSON.stringify(list));panelScenarios(`Saved "${state.name||'Untitled'}".`);};
  document.getElementById('s-sample').onclick=()=>{load(sample());panelScenarios('Loaded the example board.');};
  document.getElementById('s-blank').onclick=()=>{load(blank());panelScenarios('Started a blank board at laning phase.');};
  pbody.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{load(JSON.parse(JSON.stringify(getSaved()[b.dataset.load])));panelScenarios('Loaded.');});
  pbody.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const l=getSaved();const [r]=l.splice(b.dataset.del,1);store.set('rcb.saved',JSON.stringify(l));panelScenarios(`Deleted "${r.name||'Untitled'}".`);});
  // Export: straight to the clipboard, with a visible confirmation
  document.getElementById('s-export').onclick=()=>{
    const text=EXPORT_TAG+snap(), name=state.name||'this board';
    const fall=()=>{openImport(false);io.value=text;io.focus();io.select();
      m('Your browser blocked automatic copying. The board text is selected above: copy it with Ctrl+C / Cmd+C, or long-press and choose Copy.',true);};
    try{navigator.clipboard.writeText(text).then(()=>{toast(`Copied "${name}" to your clipboard. Paste it anywhere to share.`);m('');},fall);}catch(e){fall();}
  };
  // Import: open a paste field that loads the board as soon as valid text lands in it
  const openImport=(focus=true)=>{box.hidden=false;imp.setAttribute('aria-expanded','true');io.value='';m('');if(focus)io.focus();};
  const closeImport=()=>{box.hidden=true;imp.setAttribute('aria-expanded','false');io.value='';};
  imp.onclick=()=>box.hidden?openImport():closeImport();
  document.getElementById('s-cancel').onclick=()=>{closeImport();m('');};
  const tryLoad=(text,final)=>{
    const s=parseBoard(text);
    if(s){load(s);closeImport();panelScenarios('');toast(`Loaded "${s.name||'board'}".`);return;}
    if(final&&text.trim())m('That text isn\'t a Rift Coaching Board export. Ask for a fresh copy from Export board and paste the whole thing.',true);
  };
  io.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData)?.getData('text');if(t){e.preventDefault();io.value=t;tryLoad(t,true);}});
  let tIn;io.addEventListener('input',()=>{clearTimeout(tIn);m('');tIn=setTimeout(()=>tryLoad(io.value,true),400);});
}

/* ---------- font pairings: display / body / numbers ---------- */
const FONTS=[
  {id:'plex',name:'Chakra Petch + Plex',d:'"Chakra Petch"',b:'"IBM Plex Sans"',m:'"IBM Plex Mono"'},
  {id:'broadcast',name:'Oxanium + Barlow (broadcast)',d:'"Oxanium"',b:'"Barlow"',m:'"JetBrains Mono"'},
  {id:'arcane',name:'Cinzel + Alegreya Sans (fantasy)',d:'"Cinzel"',b:'"Alegreya Sans"',m:'"Fira Mono"'},
  {id:'arcade',name:'Russo One + Rubik (bold)',d:'"Russo One"',b:'"Rubik"',m:'"Fira Mono"'},
  {id:'poster',name:'Bebas Neue + Manrope (poster)',d:'"Bebas Neue"',b:'"Manrope"',m:'"DM Mono"'},
  {id:'tactical',name:'Saira Condensed + Saira (tactical)',d:'"Saira Condensed"',b:'"Saira"',m:'"Share Tech Mono"'}];
/* ---------- appearance: font pairing + interface color scheme (side colors stay blue/red) ---------- */
// Each scheme: page background, panel, raised panel, text, muted text, borders, buttons & highlights
const SCHEMES=[
  {id:'default',name:'Default',dots:['#e9eeed','#a8720c','#13201c']},
  {id:'infernal',name:'Infernal',bg:'#150f0d',surface:'#201714',surface2:'#2c201b',ink:'#f6ece6',muted:'#ad9a8f',line:'#3d2d26',accent:'#ff6a2b'},
  {id:'ocean',name:'Ocean',bg:'#06171e',surface:'#0c222b',surface2:'#132e39',ink:'#e4f3f5',muted:'#8aa9b0',line:'#1d3b47',accent:'#2bc4c4'},
  {id:'mountain',name:'Mountain',bg:'#16130f',surface:'#201c16',surface2:'#2b251d',ink:'#f1ebe1',muted:'#a59b8b',line:'#3a3227',accent:'#d29a52'},
  {id:'cloud',name:'Cloud',bg:'#edf3f9',surface:'#ffffff',surface2:'#e0e9f3',ink:'#15202c',muted:'#5a6776',line:'#cfdbe8',accent:'#3b7fd6'},
  {id:'hextech',name:'Hextech',bg:'#0a1428',surface:'#111d33',surface2:'#1a2a45',ink:'#f0e6d2',muted:'#a39d8e',line:'#2a3a56',accent:'#c8aa6e'},
  {id:'chemtech',name:'Chemtech',bg:'#0e1510',surface:'#151f17',surface2:'#1e2b20',ink:'#e7f0e6',muted:'#93a592',line:'#29392b',accent:'#a3e635'},
  {id:'elder',name:'Elder',bg:'#0e0d16',surface:'#171522',surface2:'#211e30',ink:'#efedf8',muted:'#a19db8',line:'#2f2b43',accent:'#c4b5fd'},
  {id:'baron',name:'Baron',bg:'#140c1c',surface:'#1f1429',surface2:'#2b1c38',ink:'#f4eaf9',muted:'#ab97b8',line:'#3c2a4c',accent:'#b44bd6'}];
const TOKENS=['bg','surface','surface2','ink','muted','line','accent'];
const FT=['accent','ink','surface','bg'];
let look={font:'plex',scheme:'default',mode:'system',over:{light:{},dark:{}}};
try{const o=JSON.parse(store.get('rcb.look'))||{};
  look.font=o.font||store.get('rcb.font')||'plex';look.scheme=({midnight:'ocean',arcane:'baron',ember:'infernal',jungle:'chemtech',frost:'cloud',broadcast:'default'})[o.scheme]||o.scheme||'default';look.mode=o.mode||'system';
  if(o.over)look.over={light:o.over.light||{},dark:o.over.dark||{}};
  else{const old={};FT.forEach(k=>{if(o[k])old[k]=o[k];});if(Object.keys(old).length)look.over.dark=old;}
}catch(e){}
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||'');
const toHex=c=>{if(hexOk(c))return c.toLowerCase();const m=String(c).match(/\d+(\.\d+)?/g);return m?'#'+m.slice(0,3).map(v=>(+v|0).toString(16).padStart(2,'0')).join(''):'#888888';};
const lum=h=>{const c=[1,3,5].map(i=>{const v=parseInt(h.slice(i,i+2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return .2126*c[0]+.7152*c[1]+.0722*c[2];};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
const inkFor=h=>contrast(h,'#111111')>=contrast(h,'#ffffff')?'#111111':'#ffffff';
const mix=(a,b,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-t)+parseInt(b.slice(i,i+2),16)*t).toString(16).padStart(2,'0')).join('');
const SHEET=['--bg','--surface','--surface-2','--ink','--muted','--line','--accent','--accent-ink','color-scheme'];
let hostTheme=document.documentElement.getAttribute('data-theme');
const deviceDark=()=>{try{return matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}};
const effMode=()=>look.mode!=='system'?look.mode:(hostTheme==='dark'||hostTheme==='light'?hostTheme:(deviceDark()?'dark':'light'));
// Each scheme has a native mode; the other mode is derived from its hue so every scheme works both ways
function variant(sc,mode){
  const native=lum(sc.bg)<.25?'dark':'light';
  if(native===mode)return {...sc};
  let t;
  if(mode==='light'){const ink=mix(sc.bg,'#000000',.15),bg=mix('#f6f6f6',sc.accent,.1),surface=mix('#ffffff',sc.accent,.025);
    t={bg,surface,surface2:mix(surface,ink,.07),ink,muted:mix(ink,bg,.42),line:mix(surface,ink,.15),accent:sc.accent};
    for(let i=0;i<10&&contrast(t.accent,surface)<3;i++)t.accent=mix(t.accent,'#000000',.15);}
  else{const bg=mix('#0b0d10',sc.accent,.07),surface=mix(bg,'#ffffff',.05),ink=mix('#f2f4f7',sc.bg,.08);
    t={bg,surface,surface2:mix(surface,ink,.07),ink,muted:mix(ink,bg,.42),line:mix(surface,ink,.15),accent:sc.accent};
    for(let i=0;i<10&&contrast(t.accent,surface)<3;i++)t.accent=mix(t.accent,'#ffffff',.15);}
  return t;
}
function schemeTokens(){
  const st=document.documentElement.style;SHEET.forEach(k=>st.removeProperty(k));
  const mode=effMode(),sc=SCHEMES.find(x=>x.id===look.scheme)||SCHEMES[0],ov=look.over[mode]||{};
  const base=sc.bg?variant(sc,mode):Object.fromEntries(TOKENS.map(k=>[k,toHex(cssVar('--'+(k==='surface2'?'surface-2':k)))]));
  const t={...base};
  FT.forEach(k=>{if(hexOk(ov[k]))t[k]=ov[k];});
  if(hexOk(ov.ink)||hexOk(ov.surface)||hexOk(ov.bg)){t.surface2=mix(t.surface,t.ink,.07);t.line=mix(t.surface,t.ink,.17);t.muted=mix(t.ink,t.bg,.4);}
  return {t,custom:!!sc.bg||FT.some(k=>hexOk(ov[k])),mode};
}
let applying=false;
function applyLook(){
  applying=true;
  const root=document.documentElement,st=root.style,f=FONTS.find(x=>x.id===look.font)||FONTS[0];
  st.setProperty('--f-display',f.d+',"Arial Narrow",system-ui,sans-serif');st.setProperty('--f-body',f.b+',system-ui,-apple-system,"Segoe UI",sans-serif');st.setProperty('--f-mono',f.m+',ui-monospace,Menlo,Consolas,monospace');
  // explicit mode: set the theme attribute so every token (side colors included) follows it
  const want=look.mode==='system'?hostTheme:look.mode;
  if((root.getAttribute('data-theme')||null)!==(want||null)){if(want)root.setAttribute('data-theme',want);else root.removeAttribute('data-theme');}
  const {t,custom,mode}=schemeTokens();
  if(custom){
    const map={bg:'--bg',surface:'--surface',surface2:'--surface-2',ink:'--ink',muted:'--muted',line:'--line',accent:'--accent'};
    for(const k in map)st.setProperty(map[k],t[k]);
    st.setProperty('--accent-ink',inkFor(t.accent));
    st.setProperty('color-scheme',lum(t.bg)<.25?'dark':'light');
  }
  const mb=document.getElementById('modeBtn');mb.dataset.now=mode;mb.setAttribute('aria-label',mode==='dark'?'Switch to light mode':'Switch to dark mode');mb.title=mb.getAttribute('aria-label');
  store.set('rcb.look',JSON.stringify(look));
  render();
  applying=false;
}
function drawLook(){
  document.getElementById('fontList').innerHTML=FONTS.map(f=>`<button class="fontcard" data-font="${f.id}" aria-pressed="${f.id===look.font}">
    <b style='font-family:${f.d},system-ui'>Baron at 24:30</b><span style='font-family:${f.b},system-ui'>${esc(f.name)}</span><i style='font-family:${f.m},monospace'>44,100g · 14–9</i></button>`).join('');
  applyLook();
  const mode=effMode();
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===look.mode));
  document.getElementById('presets').innerHTML=SCHEMES.map(sc=>{const v=sc.bg?variant(sc,mode):null,dots=v?[v.bg,v.accent,v.ink]:sc.dots;
    return `<button data-scheme="${sc.id}" aria-pressed="${sc.id===look.scheme}"><em>${dots.map(c=>`<i style="background:${c}"></i>`).join('')}</em>${esc(sc.name)}</button>`;}).join('');
  const {t}=schemeTokens(); applyLook();
  FT.forEach(k=>{document.getElementById('col-'+k).value=t[k];document.getElementById('hex-'+k).value=t[k];});
  const m=document.getElementById('lookMsg'),probs=[];
  if(contrast(t.ink,t.bg)<4.5||contrast(t.ink,t.surface)<4.5)probs.push('text is hard to read on the background');
  if(contrast(t.accent,t.surface)<2)probs.push('buttons blend into the panels');
  m.textContent=probs.length?'Heads up: '+probs.join(' and ')+'.':'';m.classList.toggle('warn',!!probs.length);
}
document.getElementById('modeSeg').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){look.mode=b.dataset.mode;drawLook();}};
document.getElementById('modeBtn').onclick=()=>{look.mode=effMode()==='dark'?'light':'dark';if(lookBack.hidden)applyLook();else drawLook();};
document.getElementById('fontList').onclick=e=>{const b=e.target.closest('[data-font]');if(b){look.font=b.dataset.font;drawLook();}};
document.getElementById('presets').onclick=e=>{const b=e.target.closest('[data-scheme]');if(b){look.scheme=b.dataset.scheme;look.over={light:{},dark:{}};drawLook();}};
FT.forEach(k=>{
  document.getElementById('col-'+k).addEventListener('input',e=>{look.over[effMode()][k]=e.target.value;applyLook();document.getElementById('hex-'+k).value=e.target.value;});
  document.getElementById('col-'+k).addEventListener('change',drawLook);
  document.getElementById('hex-'+k).addEventListener('change',e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;
    if(/^#[0-9a-f]{3}$/i.test(v))v='#'+[...v.slice(1)].map(c=>c+c).join('');
    if(hexOk(v))look.over[effMode()][k]=v.toLowerCase();drawLook();});
});
document.getElementById('lookReset').onclick=()=>{look={font:'plex',scheme:'default',mode:'system',over:{light:{},dark:{}}};drawLook();};
const lookBack=document.getElementById('lookBack');
const openLook=()=>{drawLook();lookBack.hidden=false;document.getElementById('lookClose').focus();};
const closeLook=()=>{lookBack.hidden=true;document.getElementById('lookBtn').focus();};
document.getElementById('lookBtn').onclick=openLook;
document.getElementById('lookClose').onclick=closeLook;
lookBack.addEventListener('click',e=>{if(e.target===lookBack)closeLook();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lookBack.hidden)closeLook();});

applyLook();

/* ---------- init ---------- */
document.getElementById('champ-list').innerHTML=CHAMPS.map(n=>`<option value="${esc(n)}"></option>`).join('');
buildStatic(); syncToolbar(); render(); setTab('selected');
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyLook());}catch(e){}
new MutationObserver(()=>{if(applying)return;const v=document.documentElement.getAttribute('data-theme');
  if(look.mode==='system'){hostTheme=v;applyLook();}else if(v!==look.mode){hostTheme=v;look.mode='system';applyLook();}
}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
